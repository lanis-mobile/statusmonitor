name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Dart analyze and API e2e
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Vue frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run build

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0

      - name: Start fixture server
        run: |
          STATUSMONITOR_MODE=fixture \
          STATUSMONITOR_NOW=1784116800 \
          STATUSMONITOR_STATIC_DIR="$PWD/frontend/dist" \
          PORT=8080 \
          dart run bin/server.dart &
          echo $! > /tmp/statusmonitor.pid
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/api/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready"
          exit 1

      - name: Playwright UI e2e
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:8080
          CI: true
        run: npm run test:e2e
